[package]
name = "megaglitch-ui"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"

[[bin]]
name = "megaglitch-ui"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.35.0", default-features = false, features = ["accesskit", "default_fonts", "wgpu"] }
egui-snarl = "0.11.0"
egui_tiles = { version = "0.16.0", default-features = false }
memmap2 = "0.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
lto = "thin"
codegen-units = 1
